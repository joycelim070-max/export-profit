<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수출이익관리 시스템 | 연결 테스트</title><style>body{font:16px system-ui,sans-serif;background:#edf2f8;color:#172c46;max-width:680px;margin:32px auto;padding:16px}header,section{padding:24px;border-radius:16px;margin-bottom:16px}header{background:#132c49;color:white}section{background:white}button{background:#234c75;color:white;border:0;border-radius:8px;padding:14px;font:inherit;margin:4px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#64748b}</style><header><h1>수출이익관리 시스템</h1>Microsoft 로그인 및 OneDrive 연결 테스트</header><section><p>실제 주문 데이터는 사용하지 않습니다.</p><button id="login">Microsoft 계정 로그인</button><button id="test" disabled>OneDrive 연결 확인</button><button id="clear">연결 초기화</button><pre id="status" role="status">로그인 대기 중</pre><small>이 화면은 연결 검증용입니다. 실제 장부는 기존 프로그램에서 유지하세요.</small></section><script>
'use strict';
const client='9328de49-0461-4f77-a973-f9980c051ef3',redirect='https://joycelim070-max.github.io/export-profit/',base='https://login.microsoftonline.com/consumers/oauth2/v2.0/',scope='openid profile https://graph.microsoft.com/User.Read https://graph.microsoft.com/Files.ReadWrite.AppFolder';
const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;let token=null;
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const random=()=>b64(crypto.getRandomValues(new Uint8Array(32)));
$('login').onclick=async()=>{try{if(location.href.split(/[?#]/)[0]!==redirect)throw Error('등록된 웹 주소에서 실행하세요.');const verifier=random(),state=random(),challenge=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));sessionStorage.setItem('export-auth',JSON.stringify({verifier,state}));location.assign(base+'authorize?'+new URLSearchParams({client_id:client,response_type:'code',redirect_uri:redirect,response_mode:'query',scope,state,code_challenge:challenge,code_challenge_method:'S256',prompt:'select_account'}))}catch(e){status(e.message)}};
async function graph(path){const r=await fetch('https://graph.microsoft.com/v1.0'+path,{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error('Microsoft Graph 응답: '+r.status);return r.json()}
$('test').onclick=async()=>{try{status('OneDrive 확인 중…');const folder=await graph('/me/drive/special/approot?$select=id,name,folder');if(!folder.id||!folder.folder)throw Error('앱 폴더를 확인하지 못했습니다.');status('Microsoft 로그인 성공\nOneDrive 앱 전용 폴더 접근 성공\n실제 주문 데이터는 저장하지 않았습니다.')}catch(e){status('연결 확인 실패: '+e.message)}};
$('clear').onclick=()=>{token=null;sessionStorage.removeItem('export-auth');$('test').disabled=true;status('프로그램 연결 초기화 완료. Microsoft 계정 자체는 로그아웃되지 않습니다.')};
(async()=>{const p=new URLSearchParams(location.search);if(!p.has('code')&&!p.has('error'))return;history.replaceState(null,'',location.pathname);try{const saved=JSON.parse(sessionStorage.getItem('export-auth')||'null');sessionStorage.removeItem('export-auth');if(p.has('error'))throw Error(p.get('error'));if(!saved||p.get('state')!==saved.state)throw Error('로그인 상태 확인 실패. 다시 로그인하세요.');const r=await fetch(base+'token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:client,grant_type:'authorization_code',code:p.get('code'),redirect_uri:redirect,code_verifier:saved.verifier,scope})});const j=await r.json();if(!r.ok||!j.access_token)throw Error(j.error||'토큰 발급 실패');token=j.access_token;await graph('/me?$select=id');$('test').disabled=false;status('Microsoft 로그인 성공. OneDrive 연결 확인 버튼을 누르세요.')}catch(e){token=null;status('로그인 실패: '+e.message)}})();
</script></html>
